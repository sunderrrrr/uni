<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Логотип УНИФЛОУ</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&display=swap"
      rel="stylesheet"
    />
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #faf8f5;
      }
      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        font-family: "Unbounded", sans-serif;
        font-weight: 700;
        font-size: 64px;
        letter-spacing: -0.02em;
        color: #171717;
        padding: 40px;
        transform: scale(2.5); /* ← вот эта строка */
        transform-origin: center; /* масштабирование от центра */
      }
      .logo-mark {
        width: 64px;
        height: 64px;
        flex-shrink: 0;
      }
    </style>
  </head>
  <body>
    <div class="logo">
      <svg
        class="logo-mark"
        viewBox="0 0 20 20"
        fill="none"
        xmlns="http://www.w3.org/2000/svg"
      >
        <path
          d="M2 14 C 7 14, 6 4, 11 4 S 15 14, 18 14"
          stroke="#171717"
          stroke-width="2"
          stroke-linecap="round"
        />
        <circle cx="18" cy="14" r="1.6" fill="#D8FF45" />
      </svg>
      <span>УНИФЛОУ</span>
    </div>
  </body>
</html>
